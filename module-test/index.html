<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remote Work Setup – Sirius Support</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
<style>
:root{--navy:#14284b;--green:#1a9f5b;--greenbg:#e6f6ee;--orange:#f08a24;--bg:#f2f4f7;--card:#fff;--text:#1d2733;--mut:#5d6b7c;--line:#dde2e9;--bad:#c9382f;--badbg:#fdecea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#0d1a31;--green:#35c47a;--greenbg:#12301f;--bg:#0e1623;--card:#172234;--text:#e7ecf3;--mut:#9aa8ba;--line:#2a374b;--badbg:#3a1b1a;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--navy:#0d1a31;--green:#35c47a;--greenbg:#12301f;--bg:#0e1623;--card:#172234;--text:#e7ecf3;--mut:#9aa8ba;--line:#2a374b;--badbg:#3a1b1a;--bad:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "Source Sans 3","Segoe UI",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
header{background:var(--navy);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
.top{max-width:1100px;margin:auto;display:flex;align-items:center;gap:14px;padding:12px 18px}
.logo{font-weight:800;font-size:22px;letter-spacing:.5px}.logo b{color:var(--green)}
.top .t{flex:1;font-size:14px;opacity:.85;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{width:150px;height:8px;background:#ffffff33;border-radius:9px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--green);width:0;transition:width .4s}
.pct{font-size:13px;min-width:34px;text-align:right}
.tg{background:none;border:1px solid #ffffff55;color:#fff;border-radius:6px;padding:4px 8px;cursor:pointer}
main{max-width:1100px;margin:auto;display:grid;grid-template-columns:290px 1fr;gap:22px;padding:22px 18px}
nav{background:var(--card);border:1px solid var(--line);border-radius:8px;align-self:start;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));overflow:hidden}
nav h3{margin:0;padding:14px 16px;font-size:15px;border-bottom:1px solid var(--line)}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 16px;color:var(--text);font:inherit;font-size:14px;cursor:pointer}
nav button:hover{background:var(--bg)}nav button.on{background:var(--greenbg);font-weight:700;box-shadow:inset 4px 0 var(--green)}
.dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:#fff}
.done .dot{background:var(--green);border-color:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:26px}
h1{font-size:28px;margin:0 0 6px;line-height:1.2}h2{font-size:20px;margin:26px 0 10px}
.lead{color:var(--mut);margin:0 0 18px}
.out{background:var(--greenbg);border-left:4px solid var(--green);padding:12px 16px;border-radius:4px;margin:16px 0}
.out b{display:block;margin-bottom:4px}
.pts{list-style:none;padding:0;margin:0}
.pts li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.tag{flex:none;font-size:12px;font-weight:700;border-radius:4px;padding:2px 8px;margin-top:3px}
.m{background:var(--navy);color:#fff}.r{background:var(--greenbg);color:var(--green);border:1px solid var(--green)}
.note{background:var(--card);border:1px dashed var(--orange);padding:12px 16px;border-radius:6px;margin:16px 0}
.chk label{display:flex;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer}.chk label:hover{background:var(--bg)}
.chk input{width:20px;height:20px;accent-color:var(--green);flex:none;margin-top:3px}
.q{border:1px solid var(--line);border-radius:8px;padding:18px;margin-top:8px}
.q .o{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 14px;border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:6px;font:inherit;cursor:pointer}
.q .o:hover:not(:disabled){border-color:var(--green)}
.o.ok{border-color:var(--green)!important;background:var(--greenbg)!important}.o.no{border-color:var(--bad)!important;background:var(--badbg)!important}
.fb{margin-top:8px;font-size:15px}
.btn{background:var(--orange);color:#fff;border:0;border-radius:6px;padding:11px 22px;font:inherit;font-weight:700;cursor:pointer}
.btn.g{background:var(--green);color:#fff}.btn.l{background:none;color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.act{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.f h2{border-bottom:2px solid var(--green);padding-bottom:6px;margin-top:30px}.f h3{font-size:17px;margin:20px 0 6px}.f ul{margin:6px 0 12px;padding-left:22px}.f li{margin:3px 0}.f table{width:100%;border-collapse:collapse;margin:10px 0;font-size:15px}.f th,.f td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}.f th{background:var(--navy);color:#fff}.f .imp{background:var(--greenbg);border-left:4px solid var(--green);padding:10px 14px;border-radius:4px;margin:12px 0}
.cert{text-align:center;border:3px double var(--green);padding:30px 18px;border-radius:8px;margin-top:14px}
.cert .big{font-size:48px;font-weight:800;color:var(--green)}
button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
@media(max-width:820px){main{grid-template-columns:1fr}nav{position:static}.pbar{width:80px}.top .t{display:none}.card{padding:18px}}
</style></head><body>
<header><div class="top"><div class="logo">SIRIUS<b>learn</b></div><div class="t">Remote Work Setup</div><div class="pbar"><i id="bar"></i></div><div class="pct" id="pct">0%</div><button class="tg" id="tg" aria-label="Toggle theme">◐</button></div></header>
<main><nav><h3>Course modules</h3><div id="nav"></div></nav><section id="v"></section></main>
<script>
var M=[
{t:"Sirius Specific Requirements",i:"Working remotely needs a few essentials so your work runs smoothly. These are the Sirius requirements.",
p:[["M","Dedicated workspace: quiet, professional and free from distractions."],["M","Reliable internet: minimum 50 Mbps download and 10 Mbps upload."],["M","Computer: at least 8 GB RAM and an Intel Core or AMD Ryzen 5 processor."],["R","Backup power: a UPS or alternative power source is recommended."],["R","Ergonomic setup: proper desk, chair and equipment positioning."]],
n:"Everything else in this course is labelled Recommended until management confirms which items are compulsory.",
c:["My internet meets 50 Mbps down / 10 Mbps up","My computer has 8 GB RAM and Core / Ryzen 5 or better","I have a quiet, dedicated workspace"],
q:["Which is the minimum internet speed Sirius requires?",["25 Mbps down / 5 Mbps up","50 Mbps down / 10 Mbps up","100 Mbps down / 20 Mbps up"],1,"Sirius requires at least 50 Mbps download and 10 Mbps upload."]},
{t:"Headset and Audio Equipment",i:"Clear audio means clear conversations. Poor audio makes it hard to help customers.",
p:[["R","Use a reliable USB or wired headset with a built-in microphone."],["R","Noise-cancelling headsets help, but don't replace a quiet room."],["R","Your microphone should be free of static, echo and interruptions."],["R","Keep a backup headset or earphones with a mic, tested in advance."],["R","Never use laptop speakers on customer calls. They cause echo."]],
n:"Always test your microphone and audio before your shift.",
c:["Headset is connected and the correct devices are selected","Microphone is clear and not muted","I can hear incoming audio","Backup headset is available"],
q:["A customer hears an echo on your call. What is the most likely cause?",["Using laptop speakers instead of a headset","Using Ethernet","Having a UPS"],0,"Speakers feed your customer's voice back into your microphone. Use a headset."]},
{t:"Internet Stability and Backup",i:"A fast connection isn't always a reliable one. Stability matters as much as speed.",
p:[["R","Use a reliable broadband provider and keep your router and modem in good condition."],["R","Use a wired Ethernet connection whenever possible."],["R","Place the router in a central, open spot, not inside a cabinet."],["R","Limit streaming and large downloads on other devices during shifts."],["R","Test your speed, latency and stability regularly."],["R","Have a backup: phone hotspot, portable Wi-Fi device or second provider, with enough mobile data."]],
n:"Test your backup connection before an emergency. Make sure it can run your work tools.",
c:["Primary connection is working","Hotspot or backup connection is available and tested","Phone or backup device is charged","I know how to switch to the backup"],
q:["Your main internet fails mid-shift. What should you do?",["Wait until the end of your shift","Switch to your backup and notify your Team Lead","Switch off your router"],1,"Switch to your backup, test it, and report right away."]},
{t:"Backup Power and Equipment Protection",i:"Power cuts also take down your router. Plan for both.",
p:[["R","A UPS gives temporary power so you can save work and shut down safely."],["R","Keep your laptop charged as an alternative device where permitted."],["R","Power banks and portable power stations must match your equipment's output."],["R","Keep chargers accessible, and replace damaged or frayed cables."],["R","Use surge protection. A basic extension cord may not offer it."],["R","Keep a flashlight or emergency light within reach."]],
n:"A UPS isn't unlimited power. Know how long yours can run your equipment. Safety always comes first.",
c:["UPS or backup power is charged","Laptop and chargers are ready","Router can stay powered during an outage","Cables and plugs are undamaged"],
q:["What is the main purpose of a UPS?",["Speed up your internet","Give temporary power so you can save work and shut down safely","Replace your router"],1,"A UPS bridges short outages. It will not power you through a whole shift."]},
{t:"Computer Equipment and Accessories",i:"The right accessories make you more comfortable and efficient. Needs vary by role.",
p:[["R","External monitor: more screen space for several applications."],["R","External keyboard and mouse: comfort and less strain."],["R","Working webcam where video is required, at eye level with good lighting."],["R","Laptop stand: raises the screen to a comfortable viewing height."],["R","Ethernet cable (or USB-to-Ethernet adapter) for a stable wired link."],["R","Keep equipment clean, ventilated and away from drinks."]],
n:"Not every accessory is required for every employee.",
c:["Keyboard, mouse and monitor work","Webcam works, if required for my role","Cables are tidy and not a trip hazard","Workstation is clean and organised"],
q:["Where should the top of your screen sit?",["Well above eye level","At or slightly below eye level","On your lap"],1,"At or just below eye level keeps your neck relaxed."]},
{t:"Home Network and Security",i:"You handle customer data at home. Protecting it is your responsibility.",
p:[["M","Never share your company login credentials with anyone."],["M","Enable MFA wherever required, and never approve a request you didn't start."],["M","Lock your computer when stepping away (Windows key + L)."],["R","Use a strong, unique Wi-Fi password with WPA2-AES or WPA3."],["R","Change the default router admin password and keep firmware updated."],["R","Avoid public or unsecured Wi-Fi for company systems."],["R","Keep your OS, browser and approved security software updated."],["R","Keep your screen and notes private. Report suspicious messages or incidents promptly."]],
n:"Phishing tip: be wary of urgent messages asking for passwords or MFA codes, and verify the sender independently.",
c:["Wi-Fi is protected and the router password is changed","MFA is working","My screen can't be seen by others","I know how to report a security incident"],
q:["You get an MFA prompt you didn't start. What do you do?",["Approve it to be safe","Share the code with the sender","Don't approve it and report it"],2,"An unexpected MFA request can mean someone has your password. Deny and report."]},
{t:"Software and Technical Readiness",i:"Having apps installed isn't enough. Check that you can actually use them before you start.",
p:[["M","Only access systems you are authorised to use. Never use another person's credentials."],["R","Confirm you can log in to Quinndesk/Zendesk, Moodle and your role-specific tools."],["R","Use a supported, updated browser and approved extensions only."],["R","Check microphone and camera permissions in your OS and in the application."],["R","Use a VPN only if instructed, and only the approved one."],["R","Keep software updated, but don't run big updates during customer interactions."]],
n:"If an update breaks a work application, report it instead of repeatedly reinstalling.",
c:["I can log in to all assigned platforms","Browser and OS are updated","Mic and camera permissions are enabled","I can reach company communication channels"],
q:["A page won't load but other sites work. What's a sensible first step?",["Use someone else's login","Refresh, try another supported browser, then report if it persists","Install an unapproved extension"],1,"Try basic fixes first and report the error message if the issue continues."]},
{t:"Technical Issues and Reporting",i:"Problems happen. What matters is how quickly and clearly you respond.",
p:[["M","Notify your supervisor promptly if an issue stops you from working. Don't wait until the end of your shift."],["R","Step 1: identify the issue (internet, power, computer, headset, app, login)."],["R","Step 2: try safe basic troubleshooting. Don't bypass security or attempt risky repairs."],["R","Step 3: notify your supervisor, using mobile data if your internet is down."],["R","Step 4: give the issue, start time, affected systems, steps tried, work impact and recovery time (say 'unknown' if you don't know)."],["R","Step 5: follow instructions, send updates, and confirm when you can resume."]],
n:"Example: “Hi, I'm having an internet outage that started around 10:15 AM and can't access company applications. I've checked my router and am trying my backup connection. I'll update you shortly.”",
c:["I know who to contact and how","I know what details to include","I will report repeated disruptions even if they resolve"],
q:["Which should a good issue report include?",["Only “my internet is bad”","Issue, start time, what you tried, and the impact on work","Nothing until it's fixed"],1,"Clear details help your supervisor decide next steps quickly."]},
{t:"Pre-Shift Checklist",i:"A few minutes before each shift prevents most avoidable interruptions.",
p:[["R","Computer works and is on power; charger and cables are fine."],["R","Internet is stable and meets 50/10 Mbps; backup is available."],["R","Headset, mic, keyboard and mouse work."],["R","Apps, accounts and MFA work; security software is active."],["R","Workspace is quiet and well lit; household knows your hours."],["R","Backup power is ready; water and supplies are within reach."]],
n:"If you find a problem you can't fix, tell your supervisor before your shift starts.",
c:["Computer and power","Internet and backup","Audio and accessories","Accounts and security","Workspace and supplies"],
q:["Before a shift you notice your headset isn't detected. Best action?",["Ignore it","Troubleshoot, switch to your backup headset, and report if unresolved","Use laptop speakers"],1,"Fix it early, use your backup, and inform your supervisor if it still affects your work."]}
];
var U=function(a){return '<ul>'+a.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>'},P=function(s){return '<p>'+s+'</p>'},H=function(s){return '<h3>'+s+'</h3>'},I=function(s){return '<div class="imp">'+s+'</div>'},T=function(r){return '<table>'+r.map(function(x,i){return '<tr>'+x.map(function(c){return i?'<td>'+c+'</td>':'<th>'+c+'</th>'}).join('')+'</tr>'}).join('')+'</table>'},K=function(p,a){return '<div class="chk">'+a.map(function(c,k){var id=p+'-'+k;return '<label><input type="checkbox" '+(S.chk[id]?'checked':'')+' onchange="S.chk[\''+id+'\']=this.checked;save()">'+c+'</label>'}).join('')+'</div>'};
M[0].f=function(){return P("Working in a remote environment requires a few essential elements to ensure your work and tasks run smoothly and efficiently.")+U(["<b>Dedicated Workspace:</b> A quiet, professional environment that is free from distractions.","<b>Reliable Internet:</b> A stable connection with a minimum speed of 50 Mbps download and 10 Mbps upload.","<b>Computer Requirements:</b> A device with at least 8 GB RAM and an Intel Core or AMD Ryzen 5 processor.","<b>Backup Power:</b> A UPS (Uninterruptible Power Supply) or an alternative power source is recommended to prevent disruptions.","<b>Ergonomic Setup:</b> A proper desk, chair, and equipment positioning to support comfort, posture, and long-term health."])+I("<b>Note:</b> The 50 Mbps download, 10 Mbps upload and computer specifications are Sirius requirements. Other equipment recommendations in this course are labelled as recommended until management confirms which items are compulsory.")};
M[1].f=function(){return P("Clear and professional communication is an essential part of working remotely at Sirius Support. Employees may be required to handle customer calls, participate in team meetings, attend training sessions and communicate with colleagues throughout their shifts. Having reliable audio equipment helps ensure that conversations are clear, interruptions are minimized and customers receive a professional experience.")+P("Your headset and microphone are particularly important when handling customer interactions. Poor audio quality, background noise, microphone interference or frequent disconnections can negatively affect communication and make it difficult to provide effective customer support.")+'<h2>🎧 Required and Recommended Equipment</h2>'+P("Employees should ensure they have access to the following equipment:")+H("1. Quality Headset")+P("A reliable USB or wired headset with a built-in microphone is recommended for daily work. When choosing a headset, consider the following:")+U(["<b>USB or Wired Connection:</b> A wired headset is generally recommended because it does not require charging and is less likely to experience wireless connectivity interruptions.","<b>Comfortable Design:</b> Choose a headset that can be worn comfortably throughout your working hours without causing unnecessary discomfort.","<b>Good Audio Quality:</b> Ensure that incoming audio is clear and that you can hear customers and colleagues without difficulty.","<b>Reliable Connection:</b> The headset should remain connected to your computer without frequent disconnections or interruptions."])+P("Wireless headsets may be suitable where they provide reliable connectivity and sufficient battery life. However, employees should ensure that the device remains charged and available throughout their shifts.")+H("2. Noise Cancellation and Background Noise Reduction")+P("Working remotely means employees may be sharing their home environment with family members, pets or other sources of background noise. A headset with noise-cancelling or noise-reduction capabilities is recommended to help minimize unwanted sounds during calls. Employees should also take steps to control noise within their workspace:")+U(["Work in a quiet room or designated workspace whenever possible.","Avoid having televisions, radios or loud music playing nearby.","Inform household members of your working hours to minimize interruptions.","Keep doors and windows closed when outside noise becomes distracting.","Avoid taking customer calls in busy or shared spaces."])+I("<b>Remember:</b> Noise cancellation on a headset does not replace the need for a quiet working environment. Employees are responsible for ensuring that their surroundings remain suitable for professional communication.")+H("3. Clear Microphone and Audio Quality")+P("Your microphone should capture your voice clearly without producing distracting sounds or interference. Before starting work, check that:")+U(["Your microphone is positioned correctly and is not too far from your mouth.","Your voice can be heard clearly without distortion.","There is no excessive static, crackling or buzzing.","Your microphone is not picking up unnecessary background noise.","Your headset volume is at a comfortable listening level.","Your microphone is not muted accidentally."])+P("If your microphone produces poor audio, check the cable connection, USB port and computer audio settings. You may also need to select the correct microphone as your default input device.")+H("4. Backup Headset or Audio Equipment")+P("Equipment can stop working unexpectedly, so having an alternative available can help prevent unnecessary disruptions. Employees are encouraged to keep one of the following available:")+U(["A spare USB or wired headset.","A compatible pair of earphones with a built-in microphone.","An alternative microphone where appropriate."])+P("Your backup equipment should be tested in advance to ensure it works with your computer and required applications. If your primary headset stops working during a shift, switch to your backup equipment where possible and notify your supervisor if the issue prevents you from continuing your assigned duties.")+'<h2>🖥 Using Your Audio Equipment Correctly</h2>'+P("Having the right equipment is only part of maintaining good audio quality. Employees should also understand how to use and maintain their devices. Best practices include:")+U(["Connect your headset before opening your work applications.","Check that the correct microphone and speaker devices are selected.","Test your audio using the settings available on your computer or communication application.","Keep headset cables organized and away from areas where they can become damaged.","Avoid pulling cables or disconnecting equipment by force.","Clean your headset regularly according to the manufacturer’s instructions.","Store your equipment safely when it is not in use.","Keep wireless headsets charged if you use them."])+'<h2>⚠️ Common Audio Problems and Troubleshooting</h2>'+T([["Problem","What to check"],["Microphone is not working","Check the connection, microphone permissions and selected input device."],["Customers cannot hear you clearly","Check microphone positioning, volume and background noise."],["Static or crackling sounds","Check cables, USB ports and headset connections."],["Echo during calls","Avoid using external speakers and use a headset instead."],["Headset keeps disconnecting","Check the cable, USB port, battery or wireless connection."],["No incoming audio","Check speaker settings, headset volume and selected output device."]])+P("If the problem continues after basic troubleshooting, report the issue to your supervisor or the appropriate technical support contact.")+'<h2>✅ Pre-Shift Headset and Audio Checklist</h2>'+P("Before beginning your shift, confirm that:")+K('f1',["Your headset is connected and functioning correctly.","Your microphone is working and captures your voice clearly.","You can hear incoming audio without interruptions.","Your microphone and speaker settings are configured correctly.","Your headset does not produce static, echo or excessive background noise.","Your backup audio equipment is available, where possible.","Your workspace is quiet and suitable for customer communication."])+I("<b>Important Reminder:</b> Always test your microphone and audio before starting your shift. Avoid using laptop speakers or external speakers during customer calls, as this can create background noise and echo.")+P("Maintaining good audio quality is part of providing a professional customer experience. Employees should ensure their equipment is reliable, properly maintained and ready for use throughout their working hours.")};
var S={cur:0,vis:{},ans:{},chk:{}},$=function(i){return document.getElementById(i)};
try{var sv=localStorage.getItem("sirius-rw");if(sv)S=Object.assign(S,JSON.parse(sv))}catch(e){}
function save(){try{localStorage.setItem("sirius-rw",JSON.stringify(S))}catch(e){}}
function dn(i){return S.ans[i]!==undefined}
function prog(){var n=M.filter(function(m,i){return dn(i)}).length,p=Math.round(n/M.length*100);$("bar").style.width=p+"%";$("pct").textContent=p+"%";return n}
function nav(){$("nav").innerHTML=M.map(function(m,i){return '<button class="'+(i==S.cur?"on ":"")+(dn(i)?"done":"")+'" onclick="go('+i+')"><span class="dot">'+(dn(i)?"✓":"")+'</span>'+(i+1)+'. '+m.t+'</button>'}).join("")+'<button class="'+(S.cur==9?"on":"")+'" onclick="go(9)"><span class="dot">★</span>Results and certificate</button>'}
function go(i){S.cur=i;save();render();window.scrollTo({top:0})}
function render(){nav();var n=prog();if(S.cur==9)return result();var m=M[S.cur],i=S.cur,a=S.ans[i],q=m.q;
var h='<div class="card"><h1>'+(i+1)+'. '+m.t+'</h1><p class="lead">'+m.i+'</p><div class="out"><b>Key</b><span class="tag m">Required</span> by Sirius &nbsp; <span class="tag r">Recommended</span> best practice</div>'+(m.f?'<div class="f">'+m.f()+'</div>':'<ul class="pts">'+m.p.map(function(p){return '<li><span class="tag '+p[0].toLowerCase()+'">'+(p[0]=="M"?"Required":"Recommended")+'</span><span>'+p[1]+'</span></li>'}).join("")+'</ul><div class="note">'+m.n+'</div><h2>Self-check</h2><div class="chk">'+m.c.map(function(c,k){var id=i+"-"+k;return '<label><input type="checkbox" '+(S.chk[id]?"checked":"")+' onchange="S.chk[\''+id+'\']=this.checked;save()">'+c+'</label>'}).join("")+'</div>')+'<h2>Knowledge check</h2><div class="q"><b>'+q[0]+'</b>'+q[1].map(function(o,k){var c=a===undefined?"":k==q[2]?"ok":k==a?"no":"";return '<button class="o '+c+'" '+(a!==undefined?"disabled":"")+' onclick="pick('+k+')">'+o+'</button>'}).join("")+'<div class="fb">'+(a===undefined?"":(a==q[2]?"✅ Correct. ":"❌ Not quite. ")+q[3])+'</div></div><div class="act"><button class="btn l" '+(i?"":"disabled")+' onclick="go('+(i-1)+')">Previous</button><button class="btn" '+(a===undefined?"disabled":"")+' onclick="go('+(i+1)+')">'+(i==8?"See results":"Next module")+'</button></div></div>';
$("v").innerHTML=h}
function pick(k){S.ans[S.cur]=k;save();render()}
function result(){var sc=M.filter(function(m,i){return S.ans[i]===m.q[2]}).length,n=prog(),all=n==M.length,pass=sc/M.length>=.8;
$("v").innerHTML='<div class="card"><h1>Results</h1>'+(all?'<div class="cert"><div class="big">'+sc+' / '+M.length+'</div><h2>'+(pass?"Course complete. Well done!":"Almost there")+'</h2><p>'+(pass?"You passed the Remote Work Setup course (pass mark 80%). Your workstation knowledge is ready for Sirius Support.":"You need 80% to pass. Review the modules and retake the knowledge checks.")+'</p></div>':'<p class="lead">Finish all 9 knowledge checks to see your result. You have completed '+n+' of '+M.length+'.</p>')+'<div class="act"><button class="btn l" onclick="go(0)">Review course</button>'+(all?'<button class="btn g" onclick="reset()">Retake</button>':'')+'</div></div>'}
function reset(){S={cur:0,vis:{},ans:{},chk:{}};save();render()}
$("tg").onclick=function(){var r=document.documentElement,d=r.dataset.theme=="dark"||(r.dataset.theme!="light"&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
render();
</script></body></html>
