<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day 1: UnitedMasters Foundations, Tools, Zendesk and UM Admin</title>
<style>
:root{--bg:#fff;--fg:#000;--mut:#6b6b6b;--card:#f5f5f5;--line:#dcdcdc;--acc:#000;--ok:#0a8f45;--bad:#d62828;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;line-height:1.6}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5;padding:14px 20px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.logo{font-weight:900;letter-spacing:.18em;font-size:14px}
.bar{height:3px;background:var(--line);margin-top:10px}.bar i{display:block;height:100%;width:0;background:var(--fg);transition:width .3s}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;border-bottom:1px solid var(--line)}
nav button{flex:none;background:none;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font:700 13px inherit;cursor:pointer}
nav button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
main{max-width:780px;margin:0 auto;padding:32px 20px 80px}
h1{font-size:clamp(34px,8vw,64px);line-height:1.02;font-weight:900;letter-spacing:-.03em;margin:0 0 16px}
h2{font-size:26px;font-weight:900;letter-spacing:-.02em;margin:36px 0 8px}
h3{font-size:16px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:26px 0 6px}
p,li{color:#1a1a1a}a{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
.tag{color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.14em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:16px 0}
.out{border-left:4px solid var(--fg)}
.warn{border-left:4px solid var(--bad)}
.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.quiz{margin-top:40px;border:2px solid var(--fg);border-radius:16px;padding:20px}
.quiz h2{margin-top:0}
.q{margin:18px 0}.q p{font-weight:700;margin:0 0 10px;color:var(--fg)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font:15px inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--fg)}
.opt.ok{border-color:var(--ok);background:rgba(10,143,69,.1)}.opt.bad{border-color:var(--bad);background:rgba(214,40,40,.1)}
.exp{font-size:14px;color:var(--mut);margin-top:6px}
.btn{background:var(--fg);color:var(--bg);border:0;border-radius:999px;padding:14px 28px;font:800 14px inherit;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:34px}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.links a{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;font-weight:700}
.links a:hover{border-color:var(--fg)}.links small{display:block;color:var(--mut);font-weight:400}
.score{font-size:64px;font-weight:900;letter-spacing:-.04em}
</style>
</head>
<body>
<header><div class="logo">UNITEDMASTERS <span style="color:var(--mut)">/ SUPPORT TRAINING</span></div><div class="bar"><i id="bar"></i></div></header>
<nav id="nav"></nav>
<main id="main"></main>
<script>
var L={
um:"https://unitedmasters.com/",ios:"https://apps.apple.com/us/app/unitedmasters/id1442118788",and:"https://play.google.com/store/apps/details?id=com.umandroid&hl=en&gl=US",
zd:"https://moodle-lms.sirius-support.com/mod/url/view.php?id=4624",hc:"https://moodle-lms.sirius-support.com/mod/url/view.php?id=4625",
od:"https://moodle-lms.sirius-support.com/mod/url/view.php?id=4629",wl:"https://moodle-lms.sirius-support.com/mod/url/view.php?id=4689",
wa:"https://moodle-lms.sirius-support.com/mod/url/view.php?id=4626",fu:"https://moodle-lms.sirius-support.com/mod/url/view.php?id=4627",
tr:"https://moodle-lms.sirius-support.com/mod/url/view.php?id=4628",ok:"https://moodle-lms.sirius-support.com/mod/url/view.php?id=4630",
sp:"https://moodle-lms.sirius-support.com/mod/url/view.php?id=4631",am:"https://moodle-lms.sirius-support.com/mod/url/view.php?id=4632",
rg:"https://moodle-lms.sirius-support.com/mod/url/view.php?id=4651",fin:"https://moodle-lms.sirius-support.com/mod/url/view.php?id=4652",mb:"https://moodle-lms.sirius-support.com/mod/url/view.php?id=4653",
course:"https://moodle-lms.sirius-support.com/course/view.php?id=574"};
function a(k,t){return '<a href="'+L[k]+'" target="_blank" rel="noopener">'+t+'</a>'}
var P=[
{t:"Understanding UnitedMasters and the Support Environment",h:
'<p>'+a('um','UnitedMasters')+' is a US music distribution company for independent artists. Founded in 2017 by Steve Stoute, it is a subsidiary of Translation LLC, with offices in New York, San Francisco and Los Angeles. Artists reach it through the website, the '+a('ios','iOS app')+' or the '+a('and','Android app')+'. It is estimated to serve over 1 million artists.</p>'+
'<p>Artists submit music to be played on '+a('am','Apple Music')+', '+a('sp','Spotify')+', YouTube Music, TIDAL and about 30 other streaming services (<b>DSPs</b>). UM also handles royalty collection, artist payments, reporting, and extras such as brand partnerships and promotion for larger artists.</p>'+
'<h3>Why both product knowledge and process discipline</h3><p>Knowing the product without following process gives inconsistent answers. Following process without product knowledge gives answers that don’t solve the problem. Independent artists often depend on their release and income, so a delay can feel urgent. You need both skills.</p>'+
'<h3>The artist journey</h3><div class="card">Upload → UM review and distribution → DSP availability → Royalty collection and payment</div><p>Almost every ticket sits at one stage. Ask first: <i>where in the journey is this stuck?</i></p>'+
'<h3>Memberships</h3><p>Tiers include <b>Debut</b>, <b>Select</b> and <b>Partnered Artists</b>, each with different benefits and service expectations. Always check the artist’s membership before answering a benefits question, and confirm in '+a('mb','Explanation of Membership Benefits')+'.</p>'+
'<h3>Sirius Support vs. UM internal teams</h3><p>Sirius handles first-line support for issues documented in the KB. Other issues belong to internal UM teams. Use the '+a('rg','Ticket Routing Guide')+' to decide whether to resolve or escalate.</p>'+
'<h3>Common issue families</h3><div class="tablewrap"><table><tr><th>Family</th><th>Covers</th></tr><tr><td>Account access</td><td>Login, locked accounts, email or password issues</td></tr><tr><td>Releases</td><td>Status, review, delivery, metadata, artwork</td></tr><tr><td>Payments</td><td>Royalties, payout status, payment method</td></tr><tr><td>Subscriptions</td><td>Plans, billing, renewals, cancellations</td></tr><tr><td>Artist pages / mapping</td><td>Music on the wrong or missing artist page</td></tr><tr><td>Escalations</td><td>Issues for UM internal teams</td></tr></table></div>'+
'<div class="card out"><b>Learning outcome:</b> Explain the UM business model, artist journey, membership tiers and the scope of Sirius Support.</div>',
q:[{q:"An artist says their song isn’t on Spotify. What should you ask first?",o:["What is their favorite DSP?","Where in the artist journey is the release stuck?","Which membership is cheapest?","Can they re-upload it?"],a:1,e:"Locating the stage (review, delivery, live, mapping) tells you which tool to use next."},
{q:"Which is NOT one of the common issue families?",o:["Account access","Payments","Marketing campaigns","Artist pages / mapping"],a:2,e:"The families are account access, releases, payments, subscriptions, artist pages/mapping and escalations."},
{q:"Before answering what an artist can do, you should…",o:["Rely on memory","Check their membership and the KB","Ask them to upgrade","Escalate"],a:1,e:"Benefits differ by tier, so verify rather than assume."}]},
{t:"Zendesk Fundamentals and Ticket Management",h:
'<p>Open '+a('zd','UnitedMasters Zendesk')+'. Every artist request is a <b>ticket</b> with an owner, status, fields, history and a deadline.</p>'+
'<h3>Queues and views</h3><p>A <b>view</b> is a saved list of tickets filtered by status, group or priority. Learn to switch views, sort by urgency, and spot new, yours and waiting-on-others tickets.</p>'+
'<h3>Ownership</h3><p>Set the <b>Sirius Support Agent Assignee</b> field when you take a ticket so no one duplicates your work. Never work an unassigned ticket.</p>'+
'<h3>Required fields and history</h3><p>Check required fields (such as category and disposition) every time. Read the full <b>ticket history</b> before replying so you don’t ask for information the artist already gave.</p>'+
'<h3>Statuses (rule of thumb)</h3><div class="tablewrap"><table><tr><th>Status</th><th>Use when</th></tr><tr><td>Open</td><td>Action needed from support</td></tr><tr><td>Pending</td><td>Waiting on the artist</td></tr><tr><td>On-hold</td><td>Waiting on another team or system</td></tr><tr><td>Solved</td><td>Resolved and documented</td></tr></table></div><p class="exp">Always confirm current status rules in the KB.</p>'+
'<div class="card warn"><b>SLA first.</b> Work is prioritized by SLA, not perceived complexity. A simple ticket close to breaching goes before a hard ticket with plenty of time.</div>'+
'<h3>Routing and Fin Copilot</h3><p>The '+a('rg','Ticket Routing Guide')+' says which tickets stay with Sirius. '+a('fin','Fin Copilot in Zendesk')+' is an AI helper. Verify its suggestions against the KB and tools before sending anything.</p>'+
'<div class="card out"><b>Learning outcome:</b> Navigate Zendesk, identify ownership and statuses, and recognize SLA-based priorities.</div>',
q:[{q:"You have a simple ticket due in 30 minutes and a complex one due tomorrow. Which first?",o:["The complex one","The simple one","Whichever you prefer","Neither, ask a lead"],a:1,e:"Prioritize by SLA, not complexity."},
{q:"Which field shows who owns the ticket?",o:["Disposition","Sirius Support Agent Assignee","Status","Category"],a:1,e:"The Sirius Support Agent Assignee field records the responsible agent."},
{q:"How should you treat Fin Copilot suggestions?",o:["Send as is","Verify against KB and tools","Ignore all","Forward to artist"],a:1,e:"Fin helps, but the KB is the source of truth."}]},
{t:"Knowledge Base, Macros and Ticket Documentation",h:
'<h3>Two kinds of documentation</h3><p>The '+a('hc','Customer Help Center')+' is public content for artists. <b>For Agents</b> documentation is internal and tells you how to investigate and when to escalate. Don’t mix them up.</p>'+
'<h3>Searching the KB</h3><ul><li>Start with the artist’s main keyword (for example “payout”).</li><li>Reword if the first search fails.</li><li>Read the full article and check its updated date.</li><li>Check <b>Recent Updates</b> at the start of every shift.</li></ul>'+
'<div class="card warn"><b>Source of truth:</b> if an older quiz or note conflicts with the current KB article, follow the KB and tell your trainer.</div>'+
'<h3>Using macros</h3><ol><li>Search by keyword or category.</li><li>Read the whole macro and confirm it fits.</li><li><b>Replace all bracketed text</b> before sending.</li><li>Adjust tone and remove what doesn’t apply.</li><li>Check that fields were set correctly.</li></ol>'+
'<h3>Dispositions</h3><p>A disposition records the ticket outcome for reporting and quality review. Choose what actually happened, not what’s easiest to find.</p>'+
'<h3>Internal notes</h3><p>Answer: what was the issue, what did you check, what did you find, what did you do, what’s next?</p><div class="card"><i>“Artist reports release not live on Spotify. UM Admin: Approved, delivered. Spotify for Providers: not yet visible. Sent DSP delay macro per KB. Set to Pending.”</i></div>'+
'<div class="card out"><b>Learning outcome:</b> Find the right documentation, use macros correctly and document accurately.</div>',
q:[{q:"A macro contains [Artist Name]. What do you do?",o:["Send it","Replace the bracketed text first","Delete the macro","Ask the artist"],a:1,e:"Unedited brackets look careless and confuse artists."},
{q:"A quiz answer conflicts with the current KB article. Which wins?",o:["The quiz","The KB article","Whichever is shorter","Your memory"],a:1,e:"The current KB is the source of truth."},
{q:"Which good internal note includes…",o:["Only the outcome","Issue, checks, findings, actions and next step","Just “done”","The artist’s password"],a:1,e:"Another agent should be able to pick up the ticket without asking you."}]},
{t:"UM Admin and Core Support Tools",h:
'<h3>Part A: UM Admin / '+a('od','Operator Dashboard')+'</h3><ul><li><b>User Profile</b> and <b>Artist Profile</b> (a user can link to one or more artists)</li><li><b>Release history and review</b> with statuses</li><li><b>Membership information</b></li><li><b>Account Notes</b>, so read them before acting</li><li><b>Access Controls</b></li><li><b>User ID / Artist ID</b>, used for lookups and escalations</li></ul>'+
'<div class="card warn"><b>Impersonation is for investigation only.</b> Use it to see what the artist sees. Never use it to make changes unless documented procedures explicitly allow it.</div>'+
'<h3>Part B: Core tools. Ask: what question does it answer?</h3><div class="tablewrap"><table><tr><th>Tool</th><th>Question it answers</th></tr>'+
'<tr><td>'+a('wa','Wario')+'</td><td>What do payment and release records show?</td></tr>'+
'<tr><td>'+a('fu','FUGA')+'</td><td>Was the release delivered to DSPs?</td></tr>'+
'<tr><td>'+a('wl','Watchlist')+'</td><td>Is this artist or release flagged for monitoring?</td></tr>'+
'<tr><td>'+a('sp','Spotify for Providers')+'</td><td>What does Spotify show?</td></tr>'+
'<tr><td>'+a('am','iTunes Connect / Apple Music')+'</td><td>What does Apple show?</td></tr>'+
'<tr><td>YouTube Studio</td><td>What does YouTube show for the content or channel?</td></tr>'+
'<tr><td>Music Front Desk</td><td>Which operational workflow applies?</td></tr>'+
'<tr><td>'+a('tr','Trolley')+'</td><td>What is the payout and payment method status?</td></tr>'+
'<tr><td>Chargebee</td><td>What is the subscription and billing status?</td></tr></table></div>'+
'<h3>Examples</h3><ul><li>“Song isn’t on Spotify” → UM Admin, FUGA, Spotify for Providers</li><li>“Charged but membership didn’t update” → UM Admin, Chargebee</li><li>“No payout” → UM Admin, Wario, Trolley</li></ul><p class="exp">Confirm exact tool usage in the KB.</p>'+
'<div class="card out"><b>Learning outcome:</b> Know the purpose of each system and which to consult for each ticket type.</div>',
q:[{q:"Which tools would you check for a missing payout?",o:["FUGA only","UM Admin, Wario and Trolley","YouTube Studio","Watchlist"],a:1,e:"Payment questions point to UM Admin, Wario and Trolley."},
{q:"Impersonation may be used to…",o:["Fix the artist’s account","See what the artist sees while investigating","Reset passwords","Change membership"],a:1,e:"Investigation only, unless procedures explicitly allow more."},
{q:"Which tool answers subscription and billing questions?",o:["Chargebee","FUGA","Okta","Spotify for Providers"],a:0,e:"Chargebee holds subscription and billing status."}]},
{t:"Credentials, Communication and Practical Investigation",h:
'<h3>Part A: Credentials and communication</h3><p><b>Vault Warden</b> stores shared credentials. <b>'+a('ok','Okta')+'</b> provides single sign-on. Verify both so you can log in without delays.</p><ul><li>Never share credentials in tickets, chat or email.</li><li>Never write passwords in notes.</li><li>Lock your screen when you step away.</li><li>Report any suspected compromise immediately.</li></ul>'+
'<p><b>Slack for UM escalations:</b> give a clear summary, the ticket link, the User and Artist IDs, and what you already checked. Pin your frequent systems (Zendesk, UM Admin, KB, Slack, Okta) in your browser.</p>'+
'<h3>Part B: Guided scavenger hunt</h3><ol><li>Locate a user profile.</li><li>Identify the linked artist profile.</li><li>Find a release and its status.</li><li>Verify membership.</li><li>Locate an account note.</li><li>Move between tools using the IDs.</li></ol>'+
'<h3>Part C: Your first ticket investigation</h3><div class="card"><b>1 Read</b> → <b>2 Research</b> → <b>3 Investigate</b> → <b>4 Act / Escalate</b> → <b>5 Respond</b> → <b>6 Document</b></div><p>Skipping Research and Document is the most common cause of errors.</p>'+
'<div class="card out"><b>Learning outcome:</b> Navigate the essential systems and explain the basic ticket workflow.</div>',
q:[{q:"What are the six workflow steps in order?",o:["Read, Respond, Research, Act, Investigate, Document","Read, Research, Investigate, Act/Escalate, Respond, Document","Research, Read, Act, Investigate, Document, Respond","Respond, Read, Research, Investigate, Act, Document"],a:1,e:"Read → Research → Investigate → Act/Escalate → Respond → Document."},
{q:"Where do you retrieve shared credentials?",o:["Ticket notes","Slack","Vault Warden","Browser sticky notes"],a:2,e:"Vault Warden is the approved password manager."},
{q:"A good Slack escalation includes…",o:["Just “help”","Summary, ticket link, IDs and what you checked","Artist’s password","Only the artist’s name"],a:1,e:"Complete context lets UM teams act without follow-up."}]}
];
var N=P.length,cur=0,score={},nav=document.getElementById('nav'),main=document.getElementById('main');
try{score=JSON.parse(localStorage.getItem('um1')||'{}')}catch(e){score={}}
function save(){try{localStorage.setItem('um1',JSON.stringify(score))}catch(e){}}
function total(){var c=0,t=0;P.forEach(function(p,i){p.q.forEach(function(_,j){t++;if(score[i+'_'+j])c++})});return[c,t]}
function go(i){cur=i;try{location.hash=i<N?'p'+(i+1):i==N?'links':'results'}catch(e){}render();window.scrollTo(0,0)}
function render(){
nav.innerHTML='';
P.forEach(function(p,i){nav.insertAdjacentHTML('beforeend','<button class="'+(cur==i?'on':'')+'" data-i="'+i+'">Page '+(i+1)+'</button>')});
nav.insertAdjacentHTML('beforeend','<button class="'+(cur==N?'on':'')+'" data-i="'+N+'">Links</button><button class="'+(cur==N+1?'on':'')+'" data-i="'+(N+1)+'">Results</button>');
nav.querySelectorAll('button').forEach(function(b){b.onclick=function(){go(+b.dataset.i)}});
document.getElementById('bar').style.width=Math.min(100,(cur)/(N+1)*100)+'%';
var h='';
if(cur<N){var p=P[cur];
 h+=(cur==0?'<div class="tag">Day 1 · 9:00 AM–6:00 PM EST</div><h1>UnitedMasters Foundations, Tools, Zendesk &amp; UM Admin</h1><p>Read each page, then test yourself with the quiz. When this module and the current KB disagree, the KB wins.</p>':'')+
 '<div class="tag">Page '+(cur+1)+' of '+N+'</div><h2>'+p.t+'</h2>'+p.h+'<div class="quiz"><h2>Quick quiz</h2>';
 p.q.forEach(function(q,j){h+='<div class="q" data-j="'+j+'"><p>'+(j+1)+'. '+q.q+'</p>';q.o.forEach(function(o,k){h+='<button class="opt" data-k="'+k+'">'+o+'</button>'});h+='<div class="exp"></div></div>'});
 h+='</div><div class="foot"><button class="btn ghost" '+(cur==0?'style="visibility:hidden"':'')+' id="pv">Back</button><button class="btn" id="nx">'+(cur==N-1?'Links &amp; tools':'Next page')+'</button></div>';
}else if(cur==N){
 h='<div class="tag">Quick access</div><h1>Links</h1><p>Pinned systems and courses from the Day 1 Moodle section.</p><h3>Tools</h3><div class="links">'+
 [['zd','UnitedMasters Zendesk','Ticketing'],['hc','Help Center','Customer-facing KB'],['od','Operator Dashboard','UM Admin'],['wl','Watchlist','Monitoring'],['wa','Wario','Payments / releases'],['fu','FUGA','Distribution'],['tr','Trolley','Payouts'],['ok','Okta','Sign-on'],['sp','Spotify','Spotify side'],['am','Apple Music','Apple side']].map(function(x){return a(x[0],x[1]).replace('>'+x[1]+'<','>'+x[1]+'<small>'+x[2]+'</small><')}).join('')+'</div><h3>Day 1 activities</h3><div class="links">'+
 [['rg','Ticket Routing Guide','Course'],['fin','Fin Copilot in Zendesk','Course'],['mb','Explanation of Membership Benefits','Course'],['course','Moodle course home','All modules']].map(function(x){return a(x[0],x[1]).replace('>'+x[1]+'<','>'+x[1]+'<small>'+x[2]+'</small><')}).join('')+'</div><h3>UnitedMasters</h3><div class="links">'+
 [['um','UnitedMasters.com','Website'],['ios','iOS app','App Store'],['and','Android app','Google Play']].map(function(x){return a(x[0],x[1]).replace('>'+x[1]+'<','>'+x[1]+'<small>'+x[2]+'</small><')}).join('')+'</div><div class="foot"><button class="btn ghost" id="pv">Back</button><button class="btn" id="nx">See results</button></div>';
}else{
 var r=total();h='<div class="tag">Day 1 results</div><div class="score">'+r[0]+'/'+r[1]+'</div><p>'+(r[0]==r[1]?'Perfect. You’re ready for the practical assessment.':'Revisit any page and retake its quiz to improve.')+'</p><h3>End-of-day competencies</h3><ol><li>Explain the UM business model and artist journey.</li><li>Differentiate membership tiers and Sirius scope.</li><li>Navigate Zendesk, ownership, statuses and SLA.</li><li>Locate documentation, use macros, pick dispositions.</li><li>Navigate UM Admin and the core tools.</li><li>Follow credential security and communication practices.</li><li>Complete a guided ticket investigation.</li></ol><h3>Practical assessment (with your trainer)</h3><ul><li>Documentation exercise: find the right KB article and macro</li><li>System navigation: guided scavenger hunt</li><li>Investigation exercise: Read → Research → Investigate → Act/Escalate → Respond → Document</li></ul><div class="foot"><button class="btn ghost" id="pv">Back</button><button class="btn ghost" id="rs">Reset quizzes</button></div>';
}
main.innerHTML=h;
main.querySelectorAll('.q').forEach(function(el){var j=+el.dataset.j,q=P[cur].q[j],key=cur+'_'+j;
 function lock(k){var bs=el.querySelectorAll('.opt');bs.forEach(function(b,i){b.disabled=true;if(i==q.a)b.classList.add('ok');else if(i==k)b.classList.add('bad')});el.querySelector('.exp').textContent=(k==q.a?'Correct. ':'Not quite. ')+q.e}
 if(key in score&&score[key]!==undefined&&score[key]!==false&&score[key]!==true){}
 el.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){var k=+b.dataset.k;score[key]=(k==q.a);save();lock(k)}});
});
var pv=document.getElementById('pv'),nx=document.getElementById('nx'),rs=document.getElementById('rs');
if(pv)pv.onclick=function(){go(cur-1)};if(nx)nx.onclick=function(){go(cur+1)};
if(rs)rs.onclick=function(){score={};save();go(0)};
}
function fromHash(){var h=location.hash.replace('#','');cur=h=='links'?N:h=='results'?N+1:/^p[1-5]$/.test(h)?+h[1]-1:0;render()}
window.addEventListener('hashchange',fromHash);fromHash();
</script>
</body>
</html>
